[workspace]
members = [
  "crates/iroh-rooms-core",
  # The pure v2 cryptographic/deterministic-algorithm core (issue #140 / spec
  # `v2-crypto-core-crate.md`). A NEW crate, independent of `iroh-rooms-core`
  # (spec D1): canonical CBOR, BLAKE3/Ed25519 identifiers, governance state
  # machine, fork detection, sorted member Merkle map. No network/store/async
  # dependencies; `publish = false` and unused pure infrastructure in this phase
  # (spec §12), so it stays compatible with the P-26/D-9 schema-evolution gate.
  "crates/iroh-rooms-v2-core",
  # Pure SUITE_V1 content-key primitives for #191 (spec
  # `content-key-rotation.md` D3/D3a, §7 step 2): Ed25519→X25519 conversion,
  # HKDF-SHA-256 wrap KDF, AES-256-GCM key wrap + content AEAD. A NEW sibling
  # pure crate (OQ-1 resolved: sibling, not a relaxation of
  # `iroh-rooms-v2-core`'s no-payload-encryption invariant, so that crate's
  # purity tripwire stays intact). Same purity discipline: no network, no
  # store, no async; machine-checked by its own `banned_dependencies` test.
  "crates/iroh-rooms-crypto",
  "crates/iroh-rooms-cli",
  # The real full-mesh iroh QUIC event-transport adapter (IR-0005). A shipping
  # crate (the CLI will depend on it). The throwaway spikes that used to sit
  # beside it are archived under `archive/spikes/` and are not members.
  "crates/iroh-rooms-net",
  # The public Rust SDK façade (IR-0301): a curated, stability-tiered re-export
  # of `iroh-rooms-core`/`iroh-rooms-net`'s already-shipped surface. Publish
  # order and the dry run live in `docs/sdk-publish.md`.
  "crates/iroh-rooms",
  # Throwaway measurement crates (spike-blobs, spike-nat, spike-transport,
  # spike-N40) live under `archive/spikes/` and are not workspace members.
  # `verify` and `msrv` therefore do not build their loopback self-checks.
  # Gate A result files stay at `archive/spikes/spike-nat/results/` and remain
  # checked by the release and production readiness scripts.
]
# `fuzz/` is its own workspace (nightly + libFuzzer). Exclude it so a future
# members glob cannot pull that crate into `cargo test --workspace` or stable
# clippy. It is also not listed above.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kortiene/iroh-room"
# The floor for the PURE crates that inherit this (`iroh-rooms-core`,
# `iroh-rooms-v2-core`, `iroh-rooms-crypto`): the RustCrypto/dalek stack they
# share (`ed25519-dalek 3.0.0-rc.0`, `curve25519-dalek 5.0.0`, `sha2 0.11`,
# `digest 0.11`, `signature 3.0`, `block-buffer 0.12`) declares
# `rust-version = "1.85"`; the floor is 1.89 because `aes 0.9` (the block
# cipher behind `iroh-rooms-crypto`'s `aes-gcm 0.11`) declares 1.89 — and
# `sha2 0.11.1` / `proptest 1.12` declare 1.88 (ctutils' 1.87 raise is
# dominated). Crates that link the iroh 1.0 stack do NOT inherit
# this — they declare `1.91` per-crate, so this value stays honest for the pure
# tier instead of over-declaring it.
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# `cargo test --workspace --all-targets --all-features` (scripts/verify.sh)
# links dozens of integration-test binaries, each statically pulling in the
# full iroh/quinn/rustls/tokio dependency tree. Full DWARF debug info made
# `target/debug` exceed the CI runner's disk budget, so the linker (lld) hit
# a SIGBUS mid-write on one of the later binaries. Line-tables-only debug
# info still gives file:line backtraces on test panics but cuts per-binary
# size dramatically, keeping the full workspace build inside CI's disk quota.
[profile.dev]
debug = "line-tables-only"

