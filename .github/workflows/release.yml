name: release

# Builds the Production Beta CLI archive + checksum for every supported platform
# triple, then (unless this is a dry run) attaches them to a draft release.
#
# Build jobs are contents: read and have no id-token. A dependency's build.rs
# must not be able to mint a Sigstore certificate in this workflow's name.
# They upload the archive and its .sha256 as workflow artifacts and do not
# call `gh release`.
#
# SHA256SUMS is written by `checksums`, which does not set `environment`.
# `sign-and-publish` is the only job that sets `environment: release` and the
# only job with contents: write. Referencing an environment that does not
# exist creates it with no protection rules, so `release` must already exist
# with a required reviewer before this workflow is merged. A dry run skips
# `sign-and-publish` entirely (its `if` is false) and therefore never
# references that environment. Checksums stay on the other job so a dry run
# still uploads SHA256SUMS without creating `release`.
#
# The job token on `sign-and-publish` is contents: write only. Reading
# environment protection rules (GET /repos/{owner}/{repo}/environments/release)
# requires administration read, so this workflow does not call that API: the
# call would 403 on every real release.
#
# A non-dry run fails in `tag-guard`, before any build and before any release
# API call, unless github.ref is refs/tags/v<VER> and VER is the
# iroh-rooms-cli version (the version `scripts/build-release-artifacts.sh`
# embeds in the archive name). A non-dry workflow_dispatch also fails unless
# inputs.tag equals github.ref_name. Dispatch on the tag:
#   gh workflow run release.yml --ref v<VER> -f tag=v<VER>
# Checking out inputs.tag from some other ref is what made provenance record
# the wrong source. The commit that gets built is github.sha.
#
# The draft is never published here. The release owner publishes it, and
# immutable releases reject a later overwrite. Nothing passes --clobber.
# There is no tag ruleset, so before any release write the publish job checks
# that refs/tags/v<VER> still peels to GITHUB_SHA.
#
# id-token, attestations, and artifact-metadata are intentionally absent.
# The follow-up that adds them must attest and sign only after this job's
# re-verify of the archives and SHA256SUMS, which runs before any release write.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "On a non-dry run this must equal github.ref_name (e.g. v0.1.0-rc.5). The commit built is github.sha."
        required: true
        type: string
      dry_run:
        description: "Build archives and SHA256SUMS only. Skip the tag-ref guard and do not create or modify a GitHub release."
        required: false
        type: boolean
        default: false

# Least privilege by default. sign-and-publish replaces this with contents: write.
# Unspecified scopes (including id-token) are not granted.
permissions:
  contents: read

# One release ref at a time. A second run waits; it does not cancel the first,
# because a cancelled publish could leave a partial draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-guard:
    name: tag-ref guard
    # Boolean inputs compare as booleans (`== true`), not as the string "true".
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert github.ref is refs/tags/v<workspace version>
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(awk -F ' *= *' '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' crates/iroh-rooms-cli/Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::could not read version from crates/iroh-rooms-cli/Cargo.toml"
            exit 1
          fi
          expected="refs/tags/v${version}"
          if [[ "$RELEASE_REF" != "$expected" ]]; then
            echo "::error::${RELEASE_REF} is not ${expected}. Dispatch a non-dry run on the tag ref: gh workflow run release.yml --ref v${version} -f tag=v${version}"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_TAG" != "$RELEASE_REF_NAME" ]]; then
            echo "::error::workflow_dispatch tag input does not match github.ref_name"
            printf 'inputs.tag: %s\n' "$INPUT_TAG"
            printf 'github.ref_name: %s\n' "$RELEASE_REF_NAME"
            exit 1
          fi
          echo "ref ${RELEASE_REF} matches iroh-rooms-cli ${version}"

  artifacts:
    name: ${{ matrix.target }}
    needs: tag-guard
    # Run when the guard passed, and on a dry run where the guard was skipped.
    # A failed guard skips the builds, so a bad ref never starts a publish.
    if: ${{ !cancelled() && (needs.tag-guard.result == 'success' || needs.tag-guard.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # One platform failing must not cancel the others. Successful archives
      # stay on the run for inspection. checksums and sign-and-publish still
      # require all four; a partial set is not a release.
      fail-fast: false
      matrix:
        include:
          # Both macOS triples ride the same OS 15 image: macos-13 is retired
          # (a job targeting it queues until it times out) and macos-14 is
          # deprecated.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Pinned to a commit on master (the action's own rule: a SHA pin must be
      # in master history, or the commit can be garbage-collected). Rust stays
      # 1.100.0 via the toolchain input. The @1.100.0 ref bakes that version
      # into a branch tip that is not a durable SHA. Bump the toolchain
      # deliberately, in its own PR, across verify/release-readiness/release.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      # The build script derives the archive name from the rustc host triple, so
      # a runner image whose arch drifts would publish an archive labelled for a
      # platform it cannot run on.
      - name: Assert runner host triple
        run: |
          host="$(rustc -vV | awk '/^host: / { print $2 }')"
          if [[ "$host" != "${{ matrix.target }}" ]]; then
            echo "::error::runner host triple is $host, expected ${{ matrix.target }}"
            exit 1
          fi

      - name: Build release artifact
        run: scripts/build-release-artifacts.sh

      - name: Record build host in the run log
        run: |
          rustc --version
          git rev-parse HEAD
          cat target/release-artifacts/*.tar.gz.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-rooms-${{ matrix.target }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.tar.gz.sha256
          if-no-files-found: error

  # No `environment:` here. Referencing a missing environment creates it with
  # no protection rules, and a dry run must not do that. This job runs no
  # cargo and does not write to any GitHub release.
  checksums:
    name: SHA256SUMS
    needs: artifacts
    # A dry run skips tag-guard. The default success() check then skips this
    # job too, even after every build succeeded, because a skipped ancestor
    # counts as "not success". The status function below makes GitHub evaluate
    # the condition, and the builds' result is what matters.
    if: ${{ !cancelled() && needs.artifacts.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          printf 'tag input: %s\n' "$INPUT_TAG"
          printf 'dry_run: %s\n' "$INPUT_DRY_RUN"
          printf 'github.ref: %s\n' "$RELEASE_REF"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
          pattern: iroh-rooms-*
          merge-multiple: false

      - name: Write SHA256SUMS
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(awk -F ' *= *' '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' crates/iroh-rooms-cli/Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::could not read version from crates/iroh-rooms-cli/Cargo.toml"
            exit 1
          fi
          short="${GITHUB_SHA:0:12}"
          if [[ ! "$short" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::GITHUB_SHA does not start with 12 hex characters"
            exit 1
          fi

          stage="release-assets"
          rm -rf "$stage"
          mkdir -p "$stage"

          copy_unique() {
            local file="$1"
            local base
            base="$(basename "$file")"
            if [[ -e "$stage/$base" ]]; then
              echo "::error::duplicate release file: $base"
              exit 1
            fi
            cp "$file" "$stage/$base"
          }

          while IFS= read -r -d '' file; do
            copy_unique "$file"
          done < <(find downloaded -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -print0)

          # sha256sum -c resolves names in the checksum file against the
          # working directory, so verification has to run next to the archives.
          cd "$stage"

          triples=(
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
          )
          expected=()
          for triple in "${triples[@]}"; do
            archive="iroh-rooms-${version}-${triple}-${short}.tar.gz"
            expected+=("$archive" "${archive}.sha256")
          done
          for name in "${expected[@]}"; do
            if [[ ! -f "$name" ]]; then
              echo "::error::missing required release file ${name}"
              find . -maxdepth 1 -type f -print
              exit 1
            fi
          done
          file_count=0
          for file in *; do
            if [[ ! -f "$file" ]]; then
              continue
            fi
            file_count=$((file_count + 1))
            found=0
            for name in "${expected[@]}"; do
              if [[ "$file" == "$name" ]]; then
                found=1
                break
              fi
            done
            if [[ "$found" -ne 1 ]]; then
              echo "::error::unexpected release file ${file}"
              exit 1
            fi
          done
          if [[ "$file_count" -ne "${#expected[@]}" ]]; then
            echo "::error::expected ${#expected[@]} release files, found ${file_count}"
            exit 1
          fi

          # Each .sha256 line is "<64 hex><two spaces><archive name>". Copy those
          # lines unchanged so SHA256SUMS matches the per-archive files, and
          # reject a line whose hash is not the archive's bytes.
          for sumfile in *.tar.gz.sha256; do
            line="$(cat "$sumfile")"
            name="${sumfile%.sha256}"
            recorded="${line%% *}"
            filename="${line#*  }"
            if [[ ! "$recorded" =~ ^[0-9a-f]{64}$ || "$filename" != "$name" ]]; then
              echo "::error::${sumfile} is not a bare sha256 line for ${name}"
              printf 'line: [%s]\n' "$line"
              exit 1
            fi
            actual="$(sha256sum "$name" | awk '{print $1}')"
            if [[ "$actual" != "$recorded" ]]; then
              echo "::error::hash mismatch for ${name}"
              echo "recorded: $recorded"
              echo "actual:   $actual"
              exit 1
            fi
            sha256sum -c "$sumfile"
          done

          # Field 2 is the filename; sort so the aggregate does not depend on
          # find order. sort does not rewrite the lines.
          LC_ALL=C sort -k2,2 ./*.tar.gz.sha256 > SHA256SUMS

          sum_lines="$(grep -cve '^$' SHA256SUMS || true)"
          if [[ "$sum_lines" -ne 4 ]]; then
            echo "::error::SHA256SUMS should contain 4 entries, found ${sum_lines}"
            exit 1
          fi
          for sumfile in *.tar.gz.sha256; do
            line="$(cat "$sumfile")"
            if ! grep -Fxq "$line" SHA256SUMS; then
              echo "::error::SHA256SUMS is missing the line from ${sumfile}"
              printf 'line: [%s]\n' "$line"
              exit 1
            fi
          done

          echo "SHA256SUMS"
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: release-assets/SHA256SUMS
          if-no-files-found: error

  sign-and-publish:
    name: sign-and-publish
    needs: [tag-guard, artifacts, checksums]
    # tag-guard must have succeeded, so a dry run (guard skipped) never
    # reaches environment: release. The dry_run clause is the same gate.
    if: ${{ !cancelled() && needs.tag-guard.result == 'success' && needs.artifacts.result == 'success' && needs.checksums.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
          merge-multiple: false

      # Re-verify, then confirm the tag still peels to this SHA, then write.
      # This job is the only one that holds contents: write. Attest and sign
      # (a later change) only after the re-verify below.
      - name: Attach assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="$(awk -F ' *= *' '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' crates/iroh-rooms-cli/Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::could not read version from crates/iroh-rooms-cli/Cargo.toml"
            exit 1
          fi
          expected_ref="refs/tags/v${version}"
          if [[ "$RELEASE_REF" != "$expected_ref" ]]; then
            echo "::error::refusing to publish: ${RELEASE_REF} is not ${expected_ref}"
            exit 1
          fi
          tag="v${version}"
          short="${GITHUB_SHA:0:12}"
          if [[ ! "$short" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::GITHUB_SHA does not start with 12 hex characters"
            exit 1
          fi

          stage="release-assets"
          rm -rf "$stage"
          mkdir -p "$stage"
          copy_unique() {
            local file="$1"
            local base
            base="$(basename "$file")"
            if [[ -e "$stage/$base" ]]; then
              echo "::error::duplicate release file: $base"
              exit 1
            fi
            cp "$file" "$stage/$base"
          }
          while IFS= read -r -d '' file; do
            case "$(basename "$file")" in
              *.tar.gz|*.tar.gz.sha256|SHA256SUMS) copy_unique "$file" ;;
            esac
          done < <(find downloaded -type f -print0)

          cd "$stage"
          triples=(
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
          )
          expected=(SHA256SUMS)
          for triple in "${triples[@]}"; do
            archive="iroh-rooms-${version}-${triple}-${short}.tar.gz"
            expected+=("$archive" "${archive}.sha256")
          done
          for name in "${expected[@]}"; do
            if [[ ! -f "$name" ]]; then
              echo "::error::missing required release file ${name}"
              find . -maxdepth 1 -type f -print
              exit 1
            fi
          done
          file_count=0
          for file in *; do
            if [[ ! -f "$file" ]]; then
              continue
            fi
            file_count=$((file_count + 1))
            found=0
            for name in "${expected[@]}"; do
              if [[ "$file" == "$name" ]]; then
                found=1
                break
              fi
            done
            if [[ "$found" -ne 1 ]]; then
              echo "::error::unexpected release file ${file}"
              exit 1
            fi
          done
          if [[ "$file_count" -ne "${#expected[@]}" ]]; then
            echo "::error::expected ${#expected[@]} release files, found ${file_count}"
            exit 1
          fi

          for sumfile in *.tar.gz.sha256; do
            line="$(cat "$sumfile")"
            name="$(basename "${sumfile%.sha256}")"
            recorded="${line%% *}"
            filename="${line#*  }"
            actual="$(sha256sum "$name" | awk '{print $1}')"
            if [[ "$recorded" != "$actual" || "$filename" != "$name" ]]; then
              echo "::error::$sumfile does not match $name"
              exit 1
            fi
            if ! grep -Fxq "$line" SHA256SUMS; then
              echo "::error::SHA256SUMS is missing the line from $sumfile"
              exit 1
            fi
          done
          sum_lines="$(grep -cve '^$' SHA256SUMS || true)"
          if [[ "$sum_lines" -ne 4 ]]; then
            echo "::error::SHA256SUMS does not have 4 entries, found ${sum_lines}"
            exit 1
          fi

          # No tag ruleset: the tag can move between build and publish. Peel
          # annotated tags to the commit and refuse anything other than this SHA.
          # This is the last read before a release mutation.
          ref_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .object.type)"
          ref_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .object.sha)"
          case "$ref_type" in
            commit)
              tag_commit="$ref_sha"
              ;;
            tag)
              peeled_type="$(gh api "repos/${GH_REPO}/git/tags/${ref_sha}" --jq .object.type)"
              tag_commit="$(gh api "repos/${GH_REPO}/git/tags/${ref_sha}" --jq .object.sha)"
              if [[ "$peeled_type" != "commit" ]]; then
                echo "::error::annotated tag ${tag} peels to ${peeled_type}, not a commit"
                exit 1
              fi
              ;;
            *)
              echo "::error::refs/tags/${tag} points at ${ref_type}, not a commit or annotated tag"
              exit 1
              ;;
          esac
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::refs/tags/${tag} peels to ${tag_commit}, not ${GITHUB_SHA}"
            exit 1
          fi
          echo "refs/tags/${tag} peels to ${tag_commit}"

          create_args=(
            --draft
            --verify-tag
            --title "$tag"
            --notes "Draft created by .github/workflows/release.yml. The release owner publishes this draft after review. This workflow does not publish it."
          )
          if [[ "$version" == *-* ]]; then
            create_args+=(--prerelease)
          fi

          if gh release view "$tag" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release ${tag} exists and is not a draft; refusing to modify a published release"
              exit 1
            fi
            echo "Draft ${tag} already exists; attaching assets without publishing"
          else
            gh release create "$tag" "${create_args[@]}"
          fi

          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::release ${tag} is not a draft; refusing to upload"
            exit 1
          fi
          asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          if [[ "$asset_count" -ne 0 ]]; then
            echo "::error::draft ${tag} already has ${asset_count} assets; refusing to mix in files"
            exit 1
          fi

          gh release upload "$tag" \
            ./*.tar.gz \
            ./*.tar.gz.sha256 \
            SHA256SUMS

          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::release ${tag} is no longer a draft after upload"
            exit 1
          fi
          echo "Draft ${tag} still unpublished"
