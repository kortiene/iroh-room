# cargo-deny policy (RB-REL-003 / #238): advisories, licenses, bans, sources.
# Run locally with `cargo deny check`; CI runs it in `.github/workflows/deny.yml`.

[graph]
all-features = true

[advisories]
# Every RustSec vulnerability fails the check. Unmaintained crates fail only
# when they are direct workspace dependencies; transitive ones are reported by
# `cargo audit` and tracked, but do not block (we cannot replace them without
# upstream changes). Unsound advisories fail only for direct workspace
# dependencies; transitive ones are reported by `cargo audit` and tracked, but
# do not block.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = [
  # Each entry needs an owner-approved reason and a tracking issue.
]

[licenses]
confidence-threshold = 0.9
# Permissive licenses compatible with distributing a MIT OR Apache-2.0 binary.
# MPL-2.0 is file-level copyleft (unmodified upstream use only).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Workspace crates that are `publish = false` are not license-checked.
ignore = true

[bans]
# Duplicate versions are common in the iroh/RustCrypto graph; report, don't fail.
multiple-versions = "warn"
# `warn`, not `deny`, for now: the publishable workspace crates use path-only
# dependencies on each other. Publishing the SDK (#313, RB-SDK-002) must add
# version requirements to those path deps; flip this to `deny` in that PR.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
