[package]
name = "iroh-rooms-cli"
version = "0.1.0-rc.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Iroh Rooms command-line client. Release archives ship the binary; this package is not published to crates.io."
# Not inherited: this crate links the iroh 1.0 stack, which sets a higher real
# floor than the workspace (pure-crate) value. See the MSRV note below.
rust-version = "1.91"

[[bin]]
name = "iroh-rooms"
path = "src/main.rs"

# MSRV note (spec IR-0105 D2 / OQ-1): this crate links `iroh-rooms-net` and,
# transitively, the iroh 1.0 stack — `iroh`, `iroh-base`, `iroh-blobs`,
# `iroh-dns`, `iroh-relay`, `iroh-tickets`, `iroh-util`, `irpc`, `n0-watcher`,
# `netwatch`, `portmapper` all declare `rust-version = "1.91"`. That is the real
# floor, so this crate declares 1.91 explicitly instead of inheriting the
# workspace value (1.89, the pure crates' floor). Mirrors
# `iroh-rooms-net/Cargo.toml`. CI builds this crate on a pinned 1.91 toolchain
# (`.github/workflows/msrv.yml`), or the number drifts again at the next iroh
# bump.

[lints]
workspace = true

[dependencies]
# The public Rust SDK façade (IR-0301): the CLI is the SDK's reference consumer
# and imports core/net symbols only through this crate (see `docs/sdk-coverage.md`).
# `experimental` enables the online runtime. It does NOT enable `gossip_overlay`.
# That feature pulls in `iroh-rooms-core/large_rooms` (the 5 -> 40 active-member
# cap), and the spec's Phase C gate — `docs/post-ga/specs/gossip-overlay-events-fan-out.md`
# Step 8, "only after Step 7 passes" — is not fully met. The Step 7 acceptance
# criterion itself now DOES pass on loopback: #193 (shipped in rc.5) fixed the
# three stacked hub-overload defects, and the committed matrix is clean at every
# required cell — N=5/10/20/40 x {1, 5 events/s}, 100% delivery, zero queue
# saturations, zero reconnect churn
# (`archive/spikes/spike-N40/results/results-gossip.md`). What is still owed is
# real-network (non-loopback) overlay evidence, plus the admin same-seq
# fail-closed wedge, which permanently wedges a room with no recovery path.
# Until both are closed, the shipped CLI keeps the full-mesh topology and the
# cap of 5. The overlay stays compiled and tested under `--all-features` on
# `iroh-rooms-net`, not on this binary.
iroh-rooms = { path = "../iroh-rooms", version = "0.1.0-rc.6", features = ["experimental"] }
# Async runtime for the two online commands (`room send`, `room tail`). The offline
# commands stay synchronous; each online command enters a scoped runtime (D2).
# `signal` powers `room tail`'s Ctrl-C shutdown.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
# `SecretKey` / `EndpointId` / `EndpointAddr` types crossed at the CLI boundary
# when wiring the device key into the carrier and parsing `--peer` addresses
# come from `iroh_rooms::experimental::{session, blob, pipe_runtime}` (issue
# #87) — no direct `iroh` dependency needed; the façade's re-exports are the
# same type as `iroh-rooms-net`'s (same `=1.0.1` pin, kept in sync by hand).
# Argument parsing for the subcommand tree (PRD §16 CLI surface). `derive` gives
# the declarative `Cli`/subcommand structs. Caret 4.x; the exact patch is pinned
# in Cargo.lock. (CI builds on the latest stable toolchain. This crate's real
# floor is rustc 1.91, set by the iroh 1.0 stack — see the MSRV note above;
# `clap 4.6.1` itself declares only 1.85.)
clap = { version = "4", features = ["derive"] }
# Serialize the on-disk identity profile and the `identity show --json` output.
serde = { version = "1", features = ["derive"] }
# JSON codec for the on-disk `identity.json` and `--json` output (spec D4/D7).
serde_json = "1"
# Per-OS platform-default data directory (spec D3): XDG on Linux, Application
# Support on macOS, %APPDATA% on Windows.
directories = "6"
# Lowercase-hex encoding of the secret seeds written to `identity.secret`, and
# decoding them back in the secret loader (spec IR-0102 D4). Already in
# `Cargo.lock` (used by core).
hex = "0.4"
# OS CSPRNG for the 16-byte `room_nonce` that seeds the `room_id` derivation
# (spec IR-0102 D5). Same 0.4 line `core` already resolves; in `Cargo.lock`.
getrandom = "0.4"
# Wipe transient secret-bearing buffers/strings on drop (spec D8). Already in
# `Cargo.lock`.
zeroize = "1"
# Ergonomic error context for the binary's top-level `Err -> stderr` mapping.
# Already in `Cargo.lock`.
anyhow = "1"
# Independent BLAKE3-256 recompute for `file fetch`'s hash-mismatch diagnostic
# (IR-0204 spec §7). Same 1.x line `iroh-rooms-net`/core already resolve.
blake3 = "1"
# Unique same-directory temporary files plus `persist_noclobber` keep fetched
# artifacts atomic without silently replacing an existing user file.
tempfile = "3"

[dev-dependencies]
# Spawn the built `iroh-rooms` binary and assert on stdout/stderr/exit code.
assert_cmd = "2"
# Output predicates (contains/matches) for the integration assertions.
predicates = "3"
# Parse `identity show --json` output and `identity.secret` in integration tests.
serde_json = "1"
# The two-peer integration suite (`tests/two_peer_e2e.rs`, IR-0109) runs an
# in-test loopback TCP echo target + client for the pipe tier. tokio is already a
# normal dependency of this crate, so this adds no new resolution — only the
# `net`/`io-util` features those in-test sockets need on top of the runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# Hex encoding/decoding used by the file_cli.rs hash-verification test. Already
# a resolved crate in Cargo.lock (used by core and net).
hex = "0.4"
# Stamp a future `user_version` and checkpoint a CLI-created WAL store in the
# downgrade-refusal test. Same bundled pin the core `store` feature uses.
rusqlite = { version = "0.42", features = ["bundled"] }
# SHA-256 of `rooms.db` before and after a refused open. Already in Cargo.lock.
sha2 = "0.11"
